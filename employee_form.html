<!DOCTYPE html>

<head>

<body>
    
    <center>

    <form action="login.html" method="get">
        
   <h1> Employee  Personal and Work Details</h1>
   <hr>
   <br>

       <br>

         <input type="number" placeholder="Enter your id" name="empid" required>

          <br>

           <br>
           <br>

        <lable>Department : </lable>
        <input type="text" placeholder="Enter your Department" name="department" required>
         <br>
         <br>

       <input type="number" placeholder="Enter your Salary" name="salary" required>

       <br>

        <input type="text" placeholder="Enter your Employment type" name="employment" required>

        <br>

         <br>

          <br>

         <input type="date"  name="bdate"  required>

          <br>

           <br>

          <br>

         </textarea>
         <br>
         <br>

        <input type="text" placeholder="Enter your Country" name="country" required>

        <br>

         <br>
         <br>

         <button type="reset">Reset</button>

        
    </form>
 </center>
